- aid: zeroheight:zeroheight-mcp
  name: zeroheight MCP
  description: The zeroheight Model Context Protocol server. Gives AI tools read access to a team's design
    system documentation - list styleguides, walk the navigation tree, full-text search pages (Enterprise),
    fetch page Markdown and fetch page assets - plus a closed-beta write surface that creates pages and
    resolves Figma, Storybook, git and token references. Deployed both as a hosted remote endpoint at
    https://mcp.zeroheight.com/mcp (OAuth browser login, SSO supported) and as a local stdio server published
    on npm as @zeroheight/mcp-server. Available on every plan, capped at 500 calls per month on Free and
    Starter.
  humanURL: https://help.zeroheight.com/hc/en-us/articles/48004395674011-zeroheight-MCP-overview
