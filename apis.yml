aid: zeroheight
name: Zeroheight
description: 'zeroheight is a design system platform where teams document components, patterns, guidelines
  and design tokens in a styleguide, then deliver that documentation to designers, engineers and AI agents.
  It exposes two machine surfaces: a small key-authenticated REST API (https://zeroheight.com/open_api/v2)
  covering styleguides, pages, page content, page statuses, versions, categories and token sets, and a
  substantially richer Model Context Protocol server, hosted at https://mcp.zeroheight.com/mcp and also
  shipped as the npm package @zeroheight/mcp-server, which lets a coding or prototyping agent read a team''s
  design system directly. Design tokens export in W3C DTCG format and through stable per-set Style Dictionary
  URLs usable as build-pipeline endpoints.'
