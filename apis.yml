apis:
- aid: zeroheight:zeroheight
  name: Zeroheight API
  description: 'The zeroheight REST API automates design system workflows: read styleguides, their categories,
    pages and page content (Markdown available via ?format=markdown), read published styleguide versions
    and design token sets, and write page status tags. Authentication is a paired Client ID and Access
    Token sent as the X-API-CLIENT and X-API-KEY headers. Rate limited to 30 requests per 30 seconds per
    key. API access is an Enterprise-plan feature.'
