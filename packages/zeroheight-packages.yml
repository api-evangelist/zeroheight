method: searched
source: >-
  https://registry.npmjs.org/-/v1/search?text=zeroheight ; per-package metadata read from
  registry.npmjs.org on 2026-08-28 ; https://github.com/zeroheight
description: >-
  First-party zeroheight client libraries and tooling. zeroheight publishes no REST SDK for its
  open_api/v2 surface — every official package is an agent/CI/editor integration rather than a
  wrapper over the HTTP API. All three npm packages are published from the @zeroheight scope by
  GitHub Actions.
