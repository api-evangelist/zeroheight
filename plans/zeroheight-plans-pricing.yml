description: >-
  zeroheight's published plans, read from the pricing page on 2026-08-28. Replaces a 2026-05-04
  scaffold whose Free/Professional/Enterprise quotas were invented. zeroheight prices per editor per
  month; viewers are not charged separately on the published tiers. The API and MCP facts matter
  most here: MCP is on every plan (capped at 500 calls/month on Free and Starter), while REST API
  access is Enterprise-only.
currency: USD
billing_note: Prices exclude sales tax. Yearly billing saves 15%.
plan_count: 3
