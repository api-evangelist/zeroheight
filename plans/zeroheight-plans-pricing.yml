findings:
  - REST API access is gated to Enterprise. Two of three published tiers cannot call https://zeroheight.com/open_api/v2 at all.
  - The MCP server is the opposite: available on every plan including Free, which makes the agent surface materially more accessible than the HTTP one.
  - Enterprise pricing is not published; only Free ($0) and Starter ($49/editor/month) carry numbers.
